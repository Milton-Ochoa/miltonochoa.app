{% comment %}
  Estilo de la tabla de pagos, alineado con el de viáticos (cabecera oscura, fila de
  filtros integrada y tipografía compacta). Compartido por programación y financiera.
{% endcomment %}
<style>
    .tabla-pagos { font-size: 0.82rem; }
    .tabla-pagos thead.table-dark th {
        font-weight: 600; font-size: 0.74rem; text-transform: uppercase;
        letter-spacing: 0.02em; white-space: nowrap; vertical-align: middle;
    }
    .tabla-pagos thead.table-dark tr:first-child th:first-child { border-top-left-radius: var(--bs-border-radius); }
    .tabla-pagos thead.table-dark tr:first-child th:last-child  { border-top-right-radius: var(--bs-border-radius); }
    .tabla-pagos td { vertical-align: middle; }
    .tabla-pagos tr.fila-filtros th { background-color: #2c3136; padding: 4px 6px; }
    .tabla-pagos tr.fila-filtros th input {
        width: 100%; min-width: 80px; font-size: 0.76rem; padding: 2px 6px;
        border: 1px solid #495057; background: #fff; color: #212529; border-radius: 4px;
    }
    /* Pestañas tipo pill, compactas */
    #tabsPagos .nav-link { padding: 0.3rem 0.8rem; font-size: 0.85rem; }
</style>
