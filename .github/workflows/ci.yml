name: CI

# Gate automático: corre el mismo gate manual del proyecto (check + makemigrations
# --check + test) en cada push/PR a dev y main, antes de que un commit roto llegue a
# Railway (deploy automático desde main). pip-audit añade detección de CVEs.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  gate:
    runs-on: ubuntu-latest

    # El gate corre con SQLite y sin servicios externos. settings.py fuerza
    # BASE_DOMAIN=testserver cuando 'test' está en sys.argv.
    env:
      SECRET_KEY: ci-dummy-secret-key-not-used-in-prod
      DATABASE_URL: sqlite:///db.sqlite3
      DEBUG: "False"
      BASE_DOMAIN: testserver

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Misma major.minor que produce Railway/Nixpacks (.python-version).
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

      - name: Migraciones generadas (no debe faltar ninguna)
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test

      # Informativo: reporta CVEs en dependencias pero NO tumba el build (puede haber
      # falsos positivos o avisos sin fix disponible). Se puede endurecer a bloqueante
      # más adelante quitando continue-on-error.
      - name: Auditoría de dependencias (pip-audit, informativo)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
